<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1     style="   color: blueviolet;  text-align: center;"><b>Pete's Pizza Delivery</b></h1>
   <form action="">
    <label for="">*Name</label>  
    <input type="text"> <br>
    <label for="">*Tel</label>
     <input type="number"> <br>
      <label for="">*Email</label>
      <input type="email"><br>
    <label for="">*Address</label>
    <input type="text"><br>
    <label for="">*Town City</label>
    <input type="text"><br>
    <label for="">*Postcode</label>
    <input type="number">
     <h2  style=" color: darkgreen; text-align: center;">*Required Fields</h2>
    <label for=""><b>Topping</b></label><br>
    <input  name="Topping" type="radio">Margherita  <br>
    <input  name="Topping" type="radio">Four Seasons <br>
    <input    name="Topping" type="radio">Meat Feast <br>
<br>
<label for=""><b>Size</b></label><br>
<input   name="size" type="radio">Small  <br>
    <input   name="size" type="radio">Medium<br>
    <input   name="size" type="radio">Large<br><br>
    <label for="">Extras</label><br>
    <input type="checkbox">Mushroom <br>
    <input type="checkbox">Green peppers <br>
    <input type="checkbox">Anchovies <br>
    <input type="checkbox">Extra cheese
    <br>
    <label for="">Prefered delivery time</label> <input type="time"><br>
<label for="">Delivery instructions</label>
<textarea   placeholder="Enter a delivery instructions" name="" id=""></textarea>
   </form>
   <button    style="width: 80px; height: 40px; column-rule: white;  border-radius: 6px;  background-color: blueviolet;">Submit</button>
  

</body>
</html>
